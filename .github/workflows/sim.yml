name: sim

on:
  push:
  pull_request:

jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Run AES FIPS-197 testbench
        run: |
          make test 2>&1 | tee sim.log
          grep -q "^PASS$" sim.log
