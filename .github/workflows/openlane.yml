name: openlane

on:
  workflow_dispatch:
    inputs:
      clock_period:
        description: "Clock period in ns (default 40 = 25 MHz)"
        required: false
        default: "40"

jobs:
  rtl-to-gds:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply clock period override
        env:
          PERIOD: ${{ github.event.inputs.clock_period || '40' }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "openlane/config.json"
          with open(p) as f:
              cfg = json.load(f)
          cfg["CLOCK_PERIOD"] = float(os.environ["PERIOD"])
          with open(p, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          print("CLOCK_PERIOD =", cfg["CLOCK_PERIOD"])
          PY

      - name: Install LibreLane host wrapper
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade librelane

      - name: Pull LibreLane image
        run: docker pull ghcr.io/librelane/librelane:3.0.14

      - name: LibreLane smoke test (pseudo-TTY)
        run: |
          # GitHub Actions has no TTY; --dockerized requires one.
          script -qefc "python3 -m librelane --dockerized --smoke-test" /dev/null

      - name: Run RTL-to-GDS (pseudo-TTY)
        run: |
          mkdir -p openlane/runs
          script -qefc "python3 -m librelane --dockerized openlane/config.json" /dev/null

      - name: Collect metrics summary
        if: always()
        run: |
          python3 scripts/extract_reports.py openlane/runs || true
          if [ -f docs/metrics_summary.md ]; then
            cat docs/metrics_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload metrics summary (small)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-summary
          path: docs/metrics_summary.md
          retention-days: 30
          if-no-files-found: warn

      - name: Upload full OpenLane run (large)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane-asic-flow-lab
          path: openlane/runs/**
          retention-days: 7
          if-no-files-found: warn
