name: openlane

on:
  workflow_dispatch:
    inputs:
      clock_period:
        description: "Clock period in ns (default 40 = 25 MHz)"
        required: false
        default: "40"

jobs:
  rtl-to-gds:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Apply clock period override
        env:
          PERIOD: ${{ github.event.inputs.clock_period || '40' }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "openlane/config.json"
          with open(p) as f:
              cfg = json.load(f)
          cfg["CLOCK_PERIOD"] = float(os.environ["PERIOD"])
          with open(p, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          print("CLOCK_PERIOD =", cfg["CLOCK_PERIOD"])
          PY

      - name: Pull LibreLane image
        run: docker pull ghcr.io/librelane/librelane:3.0.14

      - name: Run RTL-to-GDS in container
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/openlane/runs" "$GITHUB_WORKSPACE/.ciel"
          # No -t: GitHub Actions has no TTY (avoids "input device is not a TTY").
          docker run --rm \
            --user root \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$GITHUB_WORKSPACE/openlane/runs":/work/openlane/runs \
            -v "$GITHUB_WORKSPACE/.ciel":/ciel \
            -w /work \
            -e PDK_ROOT=/ciel \
            -e CI=true \
            ghcr.io/librelane/librelane:3.0.14 \
            bash -lc '
              set -eux
              export PDK_ROOT=/ciel
              if [ ! -d "$PDK_ROOT/pdk/sky130A" ] && [ ! -d "$PDK_ROOT/sky130A" ]; then
                python3 -m pip install --upgrade ciel
                python3 -m ciel enable sky130A || ciel enable sky130A
              fi
              # Prefer ciel root if nested
              if [ -d /ciel/pdk ]; then export PDK_ROOT=/ciel/pdk; fi
              python3 -m librelane /work/openlane/config.json
            '

      - name: Collect metrics summary
        if: always()
        run: python3 scripts/extract_reports.py openlane/runs || true

      - name: Upload OpenLane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane-asic-flow-lab
          path: |
            openlane/runs/**
            docs/metrics_summary.md
            .ciel/**
          retention-days: 14
          if-no-files-found: warn
